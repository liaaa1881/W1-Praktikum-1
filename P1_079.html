<!DOCTYPE html>
<html>
<head>
    <title>P1_079_1</title>
    <style>
        /* Gaya untuk elemen dengan class "my-class" */
        .my-class {
            font-size: 30px !important;
            color: #800080 !important;
        }

        /* Gaya untuk elemen <ul> dengan id "my-list" */
        #my-list {
            color: #0026ff;
        }

        /* Aturan gaya untuk tabel (pindahan dari style.css) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Aturan gaya untuk formulir agar posisinya di tengah */
        form {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1 style="color: blue;">Ini adalah Heading 1</h1>
    <h2 style="color: red;">Ini adalah Heading 2</h2>
    <h3 style="font-size: 18px;">Ini adalah Heading 3</h3>
    <p style="background-color: yellow;">Ini adalah sebuah paragraf</p>

    <!-- Contoh gambar -->
    <img src="gambar.jpg" alt="Deskripsi gambar">
    <br />

    <!-- Contoh tautan (link) dengan class "my-class" -->
    <a class="my-class" href="https://www.google.com">Ini adalah tautan google</a>

    <!-- Contoh daftar (list) dengan id "my-list" -->
    <ul id="my-list">
        <li>Pemrograman 4</li>
        <li>Pemrograman 5</li>
        <li>Rekayasa Perangkat Lunak</li>
    </ul>

    <!-- Contoh tabel -->
    <table>
        <tr>
            <th>Nama</th>
            <th>Usia</th>
        </tr>
        <tr>
            <td>Roni</td>
            <td>21</td>
        </tr>
        <tr>
            <td>Hanif</td>
            <td>22</td>
        </tr>
    </table>

    <!-- Contoh formulir -->
    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <input type="submit" value="Kirim">
    </form>
</body>
</html>
