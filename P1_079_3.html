<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>P1_079_3</title>
    <!-- CSS Internal tiruan Bootstrap agar pasti tembus dan tidak terblokir file lokal -->
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: #212529;
        }

        .navbar {
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #dee2e6;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 400;
            text-decoration: none;
            color: #000;
            margin-right: 2rem;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 1rem;
        }

        .nav-link {
            text-decoration: none;
            color: rgba(0,0,0,.55);
        }

            .nav-link:hover {
                color: rgba(0,0,0,.7);
            }

        .jumbotron {
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            background-color: transparent;
            border-radius: .3rem;
        }

        .display-4 {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .lead {
            font-size: 1.25rem;
            font-weight: 300;
        }

        hr.my-4 {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            border: 0;
            border-top: 1px solid rgba(0,0,0,.1);
        }

        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border-radius: 0.25rem;
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn-primary {
            color: #fff;
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-success {
            color: #fff;
            background-color: #198754;
            border-color: #198754;
            margin-top: 10px;
        }

        form {
            margin-top: 1.5rem;
            padding: 0 1rem;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

            .form-group label {
                display: inline-block;
                margin-bottom: 0.5rem;
            }

        .form-control {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#">Latihan HTML</a>
        <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="#">Beranda</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Tentang</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Kontak</a>
            </li>
        </ul>
    </nav>

    <!-- Jumbotron -->
    <div class="jumbotron">
        <h1 class="display-4">Selamat Datang!</h1>
        <p class="lead">Ini adalah halaman web Bootstrap sederhana.</p>
        <hr class="my-4">
        <p>Silakan menjelajahi halaman web ini.</p>
    </div>

    <!-- Tombol -->
    <div style="padding: 0 1rem;">
        <button type="button" class="btn btn-primary">Klik Saya</button>
    </div>

    <!-- Formulir -->
    <form>
        <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Masukkan email">
        </div>
        <button type="submit" class="btn btn-success">Kirim</button>
    </form>

</body>
</html>
