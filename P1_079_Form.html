<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>P1_079_Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Menu Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="P1_079_Home.html">Praktikum 079</a>
            <div class="navbar-nav">
                <a class="nav-link" href="P1_079_Home.html">Beranda</a>
                <a class="nav-link" href="P1_079_Profile.html">Profil</a>
                <a class="nav-link active" href="P1_079_Form.html">Formulir Lengkap</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card p-4 shadow-sm">
            <h2 class="mb-4">Formulir Lengkap</h2>
            <form>
             
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap (Textbox):</label>
                    <input type="text" class="form-control" placeholder="Masukkan nama...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Alamat (Textarea):</label>
                    <textarea class="form-control" rows="3" placeholder="Masukkan alamat..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Jenis Kelamin (Radio Button):</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jk" id="L">
                        <label class="form-check-label" for="L">Laki-laki</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jk" id="P">
                        <label class="form-check-label" for="P">Perempuan</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Hobi (Checkbox):</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="h1">
                        <label class="form-check-label" for="h1">Membaca</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="h2">
                        <label class="form-check-label" for="h2">Coding</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Program Studi (Dropdown List):</label>
                    <select class="form-select">
                        <option selected>Pilih salah satu...</option>
                        <option>Teknologi Rekayasa Perangkat Lunak</option>
                        <option>Teknik Komputer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Kirim</button>
                <a href="P1_079_Home.html" class="btn btn-secondary">Kembali</a>
            </form>
        </div>
    </div>
</body>
</html>
